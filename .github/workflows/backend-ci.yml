name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'Shared_Ground_Station/backend/**'
      - 'CanSAT/Firmware/Ground_Station/**'
      - 'CanSAT/Testing/**'
      - 'Rideshare_Payload/Firmware/Ground_Station/**'
      - 'Rideshare_Payload/Testing/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'Shared_Ground_Station/backend/**'
      - 'CanSAT/Firmware/Ground_Station/**'
      - 'CanSAT/Testing/**'
      - 'Rideshare_Payload/Firmware/Ground_Station/**'
      - 'Rideshare_Payload/Testing/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Shared_Ground_Station/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Shared_Ground_Station/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test
