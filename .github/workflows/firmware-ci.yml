name: Firmware CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'CanSAT/Firmware/**'
      - 'Rideshare_Payload/Firmware/**'
      - '.github/workflows/firmware-ci.yml'
  push:
    branches: [main]
    paths:
      - 'CanSAT/Firmware/**'
      - 'Rideshare_Payload/Firmware/**'
      - '.github/workflows/firmware-ci.yml'

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build CanSat Flight Computer Firmware
        run: |
          pio run -d CanSAT/Firmware/Flight_Computer

      - name: Build CanSat Ground Station Firmware
        run: |
          pio run -d CanSAT/Firmware/Ground_Station

      - name: Build Rideshare Flight Computer Firmware
        run: |
          pio run -d Rideshare_Payload/Firmware/Flight_Computer

      - name: Build Rideshare Ground Station Firmware
        run: |
          pio run -d Rideshare_Payload/Firmware/Ground_Station

      - name: Build Rideshare Camera Module Firmware
        run: |
          pio run -d Rideshare_Payload/Firmware/Camera_Module
